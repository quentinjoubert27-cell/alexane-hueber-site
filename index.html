<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="home">

<header class="site-header"></header>

<main>
  <section class="hero">
    <div class="media"><img src="images/projects/project-5/01.jpg" alt="Large restaurant room with crystal chandeliers, wooden tables and a copper bar"></div>
    <div class="hero__text">
      <h1 class="wide">New Collection</h1>
      <a class="more" href="#projets">Discover More</a>
    </div>
  </section>

  <section class="tiles" aria-label="Our work">
    <a class="tile" href="#campagnes">
      <span class="tile__img"><span class="media"><img src="images/projects/project-1/04.jpg" alt="Bar with green glazed tiles and shelves of bottles"></span></span>

      <p>Stories told through images</p>

    <a class="tile" href="projects.html" id="projets">

      <p>Spaces considered in every detail</p>

    <div class="panel">

      <div class="panel__text">
        <h2 class="wide">The Gallery</h2>
        <a class="more" href="#">View Exhibition</a>
