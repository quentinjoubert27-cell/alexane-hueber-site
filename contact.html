<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add('js')</script>
<title>Contact — Alexane Hueber</title>
<meta name="description" content="Contact the Alexane Hueber design studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">

<header class="site-header"></header>

<main class="ct-page">
  <!-- Pour remplacer le visuel : mettre <img src="..." alt="..."> (ou <video>) dans le .media, sans classe ph-… -->
  <div class="pj-cell ct-media"><div class="pj-img"><div class="media"><img src="images/projects/project-5/02.jpg" alt="Pastry counter with red lanterns and a chandelier under a patterned ceiling"></div></div></div>

  <section class="ct-content st-reveal">
    <h1 class="wide">Contact</h1>
    <p class="ct-intro">Tell us about your project using the form below,<br>and we will get back to you shortly.</p>

    <form class="ct-form">
      <p class="ct-note">* indicates a required field</p>

      <fieldset class="ct-choice">
        <legend>I am a:</legend>
        <label><input type="radio" name="client_type" value="individual" checked> Individual</label>
        <label><input type="radio" name="client_type" value="professional"> Professional</label>
      </fieldset>

      <div class="ct-field">
        <input id="ct-first-name" type="text" name="first_name" autocomplete="given-name" placeholder=" " required>
        <label for="ct-first-name">First name*</label>
      </div>
      <div class="ct-field">
        <input id="ct-last-name" type="text" name="last_name" autocomplete="family-name" placeholder=" " required>
        <label for="ct-last-name">Last name*</label>
      </div>
      <div class="ct-field">
        <input id="ct-email" type="email" name="email" autocomplete="email" placeholder=" " required>
        <label for="ct-email">Email*</label>
      </div>
      <div class="ct-field">
        <select name="inquiry_type" aria-label="Inquiry type" required>
          <option value="" selected disabled>Select inquiry type*</option>
          <option>New project</option>
          <option>Press</option>
          <option>Partnership</option>
          <option>Careers</option>
          <option>Other</option>
        </select>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
      </div>
      <div class="ct-field">
        <input id="ct-phone" type="tel" name="phone" autocomplete="tel" placeholder=" " required>
        <label for="ct-phone">Phone number*</label>
      </div>
      <div class="ct-field">
        <textarea id="ct-message" name="message" rows="5" placeholder=" " required></textarea>
        <label for="ct-message">Message*</label>
      </div>

      <label class="ct-check"><input type="checkbox" name="newsletter"> Subscribe to the Alexane Hueber newsletter</label>

      <button class="ct-submit" type="submit">Submit</button>
      <p class="ct-status" role="status" hidden>This form is not connected yet: your message has not been sent.</p>
    </form>
  </section>
</main>

<footer class="site-footer"></footer>

<script src="supabase-config.js"></script>
<script src="projects.js"></script>
<script src="site-loader.js"></script>
</body>
</html>
